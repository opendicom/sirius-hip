[package]
name = "sirius-hip"
version = "1.3.0"
edition = "2021"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
time = { version = "0.3", features = ["macros"] }
async-trait = "0.1"
toml = "1"
clap = { version = "4", features = ["derive", "cargo"] }

regex = "1.8"
chrono = { version = "0.4.26", features = ["serde"] }
jsonwebtoken = "8.3"

anyhow = "1.0"

sqlx = { version = "0.7", features = [ "runtime-tokio", "mysql", "postgres", "chrono" ] }

mongodb = "3.5.0"

quick-xml = "0.28"
crc32fast = "1.3.2"
reqwest = { version = "0", features = [ "stream" ] }

dicom-object = "= 0.6.1"
dicom-encoding = "^0.6.0"
dicom-dictionary-std = "^0.6.0"
dicom-transfer-syntax-registry = "^0.6.0"
dicom-core = "^0.6.1"
dicom-json = "0.1.0"

tokio-stream = "0.1.14"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-stream = "0.3.3"

async_zip = { version = "0.0.18", features = ["tokio"] }

sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
zip = "0.6"


